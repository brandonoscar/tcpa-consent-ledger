[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tcpa-consent-ledger"
version = "0.1.0"
description = "SMS consent that fails closed: a consent and opt-out ledger, STOP/START handling, per-state quiet hours and Twilio webhook verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Brandon Oscar" }]
keywords = ["sms", "tcpa", "consent", "twilio", "a2p", "10dlc", "compliance", "opt-out"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
    "Typing :: Typed",
]
# Standard library only, except where Python ships no time zone database
# (Windows): there, tzdata, without which every quiet-hours check refuses.
# The Postgres store is an extra.
dependencies = ['tzdata; sys_platform == "win32"']

[project.optional-dependencies]
postgres = ["asyncpg>=0.30"]
dev = [
    "asyncpg>=0.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.urls]
Source = "https://github.com/brandonoscar/tcpa-consent-ledger"
Issues = "https://github.com/brandonoscar/tcpa-consent-ledger/issues"
Changelog = "https://github.com/brandonoscar/tcpa-consent-ledger/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/consent_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = ["postgres: needs a Postgres database (CONSENT_LEDGER_TEST_DSN)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true
